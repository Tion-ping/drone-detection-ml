[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-detector"
version = "0.1.0"
description = "ML brain: YOLOv8 inference + pixel→ENU bearing conversion for the drone-tracking pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "onnxruntime>=1.17",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_detector = ["py.typed"]
